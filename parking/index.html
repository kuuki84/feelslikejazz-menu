<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>기분이재즈 주차 지도</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<style>
  :root { --bg:#111; --panel:#1c1c1e; --text:#f2f2f2; --muted:#9a9a9a; --closed:#22c55e; --open:#ef4444; --unknown:#8e8e93; --lot:#3b82f6; --accent:#f5b942; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font-family:-apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  body { display:flex; flex-direction:column; }
  header { padding:10px 12px 8px; background:var(--panel); display:flex; flex-direction:column; gap:8px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  h1 { font-size:16px; margin:0; flex:1; }
  button, input, select { font:inherit; font-size:15px; border-radius:10px; border:1px solid #3a3a3c; background:#2c2c2e; color:var(--text); padding:8px 10px; }
  button.on { background:var(--accent); color:#111; border-color:var(--accent); font-weight:700; }
  input[type=date] { flex:1; min-width:130px; }
  select { flex:1; min-width:100px; }
  .when { font-size:13px; color:var(--muted); }
  .legend { display:flex; gap:12px; font-size:12px; color:var(--muted); flex-wrap:wrap; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:4px; vertical-align:middle; }
  #map { flex:1; min-height:50vh; }
  #list { max-height:34vh; overflow:auto; background:var(--panel); padding:4px 12px 16px; }
  .item { padding:9px 0; border-bottom:1px solid #2c2c2e; display:flex; gap:10px; align-items:flex-start; }
  .item b { font-size:15px; }
  .item small { color:var(--muted); display:block; margin-top:2px; font-size:12px; line-height:1.4; }
  .item .st { margin-left:auto; font-size:13px; font-weight:700; white-space:nowrap; }
  .note { color:var(--muted); font-size:13px; padding:10px 0; line-height:1.5; }
  .pin { width:18px; height:18px; border-radius:50%; border:2px solid #fff; box-shadow:0 0 3px #000; }
  .pin.park { width:24px; height:24px; color:#fff; font:800 13px/20px sans-serif; text-align:center; }
  .lotpin.free { background:var(--closed); width:28px; height:28px; font-size:17px; line-height:24px; }
  .lotpin.paid { background:#636366; }
  .lotpin { width:22px; height:22px; border-radius:5px; background:var(--lot); color:#fff; font:700 14px/22px sans-serif; text-align:center; border:2px solid #fff; box-shadow:0 0 3px #000; }
  .chips { display:flex; gap:6px; overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:2px; }
  .chips button { flex:0 0 auto; padding:6px 10px; font-size:14px; line-height:1.2; }
  .chips button small { display:block; font-size:11px; color:var(--muted); font-weight:400; }
  .chips button.on small { color:#111; }
  .chips button.today { border-color:var(--accent); }
  .sec { padding:10px 0 4px; border-bottom:1px solid #2c2c2e; }
  .sec h3 { margin:0 0 6px; font-size:14px; color:var(--accent); }
  .tl { display:flex; gap:8px; padding:5px 4px; font-size:13px; line-height:1.45; cursor:pointer; }
  .tl .t { width:44px; flex:0 0 auto; font-weight:700; }
  .tl .n { width:58px; flex:0 0 auto; color:var(--closed); font-weight:700; }
  .tl.sel { background:#2c2c2e; border-radius:8px; }
  .off { color:#4ade80; }
  .basepin { font-size:26px; line-height:26px; text-shadow:0 0 4px #000; }
  .me { width:16px; height:16px; border-radius:50%; background:#0a84ff; border:3px solid #fff; box-shadow:0 0 0 6px rgba(10,132,255,.25); }
  .leaflet-popup-content { font-size:14px; line-height:1.5; }
  .leaflet-popup-content a { color:#0a6cff; }
</style>
</head>
<body>
<header>
  <div class="row">
    <h1>🎷 기분이재즈 주차 지도</h1>
    <button id="btnMe" title="내 위치">📍 내 위치</button>
  </div>
  <div class="row">
    <button id="btnFree">🅿️ 주차 가능만 보기</button>
  </div>
  <div class="chips" id="dayChips"></div>
  <div class="chips" id="timeChips"></div>
  <div class="row">
    <span class="when" id="when"></span>
  </div>
  <div class="row"><b id="freeCount" style="color:var(--closed);font-size:14px"></b></div>
  <div class="legend">
    <span style="color:var(--text)">주차</span>
    <span><span class="dot" style="background:#ef4444"></span>불가(영업 중)</span>
    <span><span class="dot" style="background:#f97316"></span>1시간 안 마감</span>
    <span><span class="dot" style="background:#eab308"></span>30분 안 마감</span>
    <span><span class="dot" style="background:#22c55e"></span>마감 후 가능</span>
    <span><span class="dot" style="background:#15803d"></span>휴무·종일 가능</span>
    <span><span class="dot" style="background:var(--unknown)"></span>시간 모름</span>
    <span><span class="dot" style="background:var(--closed);border-radius:2px"></span>주차장 무료</span>
    <span><span class="dot" style="background:#636366;border-radius:2px"></span>주차장 유료</span>
  </div>
</header>
<div id="map"></div>
<div id="list"></div>

<script src="vendor/leaflet/leaflet.js"></script>
<script>
const RADIUS = 1000; // 가게에서 1km
const DAYS = ['sun','mon','tue','wed','thu','fri','sat'];
const DAY_KO = ['일','월','화','수','목','금','토'];
let onlyFree = false, BASE_KEY = 'parking.baseOverride';
let DATA = null, map, meMarker, meAccuracy, mePos = null, watchId = null, useNow = true, follow = false;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const toMin = hm => { const [h,m] = hm.split(':').map(Number); return h*60 + m; };
const fmt = m => `${pad(Math.floor((m%1440)/60))}:${pad(m%60)}`;

// 요일 칩(월~일)과 저녁 시각 칩(19:00~23:30, 30분 단위)
const SLOTS = []; for (let m = 19*60; m <= 23*60+30; m += 30) SLOTS.push(m);
let selDay = new Date().getDay(), selMin = 19*60;

function chosenDate() {
  if (useNow) return new Date();
  const n = new Date(), d = new Date(n.getFullYear(), n.getMonth(), n.getDate() + ((selDay - n.getDay() + 7) % 7));
  d.setHours(Math.floor(selMin/60), selMin%60, 0, 0);
  return d;
}

// 그 요일에 언제 문을 닫는지: {kind:'off'|'unknown'|'late'|'early'|'evening', close}
function closeInfo(hours, day) {
  if (!hours) return {kind:'unknown'};
  const h = hours[DAYS[day]];
  if (h === '휴무') return {kind:'off'};
  if (h === null || h === undefined) return {kind:'unknown'};
  let close = -1, late = false;
  for (const part of String(h).split(',')) {
    const [a,b] = part.trim().split('-').map(toMin);
    if (b <= a) late = true; else close = Math.max(close, b);
  }
  if (late) return {kind:'late'};
  if (close < 19*60) return {kind:'early', close};
  return {kind:'evening', close};
}

function storesInRange() {
  return (DATA.stores || []).filter(s => s.lat != null && s.lng != null && dist(DATA.base, s) <= RADIUS);
}

function renderChips() {
  const today = new Date().getDay(), stores = storesInRange();
  const order = [1,2,3,4,5,6,0];
  $('dayChips').innerHTML = order.map(d => {
    const off = stores.filter(s => closeInfo(s.hours, d).kind === 'off').length;
    return `<button data-day="${d}" class="${!useNow && d === selDay ? 'on' : ''} ${d === today ? 'today' : ''}">${DAY_KO[d]}${d === today ? '(오늘)' : ''}<small>휴무 ${off}곳</small></button>`;
  }).join('');
  const day = useNow ? today : selDay;
  const closedBy = m => stores.filter(s => { const c = closeInfo(s.hours, day); return c.kind === 'off' || c.kind === 'early' || (c.kind === 'evening' && c.close <= m); }).length;
  $('timeChips').innerHTML = `<button id="btnNow" class="${useNow ? 'on' : ''}">지금<small>실시간</small></button>`
    + SLOTS.map(m => `<button data-min="${m}" class="${!useNow && m === selMin ? 'on' : ''}">${fmt(m)}<small>닫음 ${closedBy(m)}곳</small></button>`).join('');
  document.querySelectorAll('#dayChips button').forEach(b => b.onclick = () => { selDay = Number(b.dataset.day); useNow = false; render(); });
  document.querySelectorAll('#timeChips button[data-min]').forEach(b => b.onclick = () => { selMin = Number(b.dataset.min); if (useNow) selDay = new Date().getDay(); useNow = false; render(); });
  $('btnNow').onclick = () => setNow(true);
  document.querySelectorAll('.chips button.on').forEach(b => b.scrollIntoView({block:'nearest', inline:'center'}));
}

// 목록 위 요약: ① 그날 쉬는 가게 ② 30분 단위로 새로 문 닫는 가게
function summaryHtml(day) {
  const stores = storesInRange(), nm = s => esc(s.name);
  const by = k => stores.filter(s => closeInfo(s.hours, day).kind === k);
  const off = by('off'), early = by('early'), late = by('late'), unk = by('unknown');
  let cum = off.length + early.length;
  const rows = SLOTS.map(m => {
    const now = stores.filter(s => { const c = closeInfo(s.hours, day); return c.kind === 'evening' && c.close > m - 30 && c.close <= m; });
    cum += now.length;
    return `<div class="tl ${!useNow && m === selMin ? 'sel' : ''}" data-min="${m}"><span class="t">${fmt(m)}</span><span class="n">+${now.length} (${cum})</span><span>${now.length ? now.map(nm).join(', ') : '<span style="color:var(--muted)">-</span>'}</span></div>`;
  }).join('');
  const after = stores.filter(s => { const c = closeInfo(s.hours, day); return c.kind === 'evening' && c.close > SLOTS[SLOTS.length-1]; });
  return `<div class="sec"><h3>${DAY_KO[day]}요일 쉬는 가게 ${off.length}곳</h3>
      <div class="note off" style="padding:0 0 6px">${off.length ? off.map(nm).join(', ') : '없음'}</div>
      ${early.length ? `<div class="note" style="padding:0 0 6px">19시 전에 닫음: ${early.map(s => `${nm(s)}(${fmt(closeInfo(s.hours, day).close)})`).join(', ')}</div>` : ''}</div>
    <div class="sec"><h3>${DAY_KO[day]}요일 문 닫는 시각 <small style="color:var(--muted);font-weight:400">+새로 닫음 (누적, 휴무 포함)</small></h3>${rows}
      ${after.length ? `<div class="note" style="padding:4px 0">23:30 뒤 닫음: ${after.map(nm).join(', ')}</div>` : ''}
      ${late.length ? `<div class="note" style="padding:4px 0">새벽까지 영업(자리 안 남): ${late.map(nm).join(', ')}</div>` : ''}
      ${unk.length ? `<div class="note" style="padding:4px 0">영업시간 모름: ${unk.map(nm).join(', ')}</div>` : ''}</div>
    <div class="sec"><h3>${useNow ? '지금' : `${DAY_KO[day]}요일 ${fmt(selMin)}`} 기준 가게·주차장</h3></div>`;
}


// 그 시각에 hours 범위 안인지. 전날 밤을 넘겨 이어진 영업도 봄.
// 결과: {state:'open'|'closed'|'unknown', closeAt, openAt}
function statusAt(hours, when) {
  if (!hours) return {state:'unknown'};
  const day = when.getDay(), min = when.getHours()*60 + when.getMinutes();
  const today = hours[DAYS[day]], yest = hours[DAYS[(day+6)%7]];
  if (today === undefined && yest === undefined) return {state:'unknown'};
  const ranges = r => (!r || r === '휴무') ? [] : String(r).split(',').map(s => s.trim().split('-').map(toMin));
  // 어제 시작해서 오늘 새벽까지 이어지는 영업
  for (const [a,b] of ranges(yest)) if (b <= a && min < b) return {state:'open', closeAt:b};
  if (today === null || today === undefined) return {state:'unknown'};
  for (const [a,b] of ranges(today)) {
    const end = b <= a ? b + 1440 : b;
    if (min >= a && min < end) return {state:'open', closeAt:end};
  }
  const later = ranges(today).map(([a]) => a).filter(a => a > min).sort((x,y)=>x-y)[0];
  const lastClose = ranges(today).map(([a,b]) => b <= a ? null : b).filter(b => b !== null && b <= min).sort((x,y)=>y-x)[0];
  return {state:'closed', openAt:later, closedSince:lastClose, dayOff: today === '휴무'};
}

function lotStatus(lot, when) {
  const s = statusAt(lot.paid, when);
  if (s.state === 'open') return {free:false, label: s.closeAt >= 1440 ? '유료' : `유료 (${fmt(s.closeAt)}부터 무료)`};
  if (s.state === 'closed' || lot.paid && lot.paid[DAYS[when.getDay()]] === null) return {free:true, label:'무료 시간'};
  return {free:null, label:'요금 시간 모름'};
}

function hoursText(hours) {
  if (!hours) return '영업시간 모름';
  const order = [1,2,3,4,5,6,0];
  return order.map(i => `${DAY_KO[i]} ${hours[DAYS[i]] ?? '모름'}`).join(' · ');
}

function navLink(name, lat, lng) {
  return `https://map.kakao.com/link/to/${encodeURIComponent(name)},${lat},${lng}`;
}

function dist(a, b) {
  const R = 6371000, r = Math.PI/180, dLat = (b.lat-a.lat)*r, dLng = (b.lng-a.lng)*r;
  const h = Math.sin(dLat/2)**2 + Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}

// 지도 바꿔 끼우기: 네이버(열쇠가 있으면) 또는 OpenStreetMap(Leaflet)
function makeLeaflet() {
  const m = L.map('map', {zoomControl:true});
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, subdomains:'abc', attribution:'© OpenStreetMap'}).addTo(m);
  const group = L.layerGroup().addTo(m); const popups = [];
  return {
    setView: (ll, z) => { m.invalidateSize(); m.setView(ll, z); }, panTo: ll => m.panTo(ll),
    onDragStart: cb => m.on('dragstart', cb),
    clear: () => { group.clearLayers(); popups.length = 0; },
    circle: (ll, radius, o, keep) => { const c = L.circle(ll, {radius, color:o.color, weight:o.weight, fillOpacity:o.fillOpacity, interactive:false}).addTo(keep ? m : group);
      return {set: (ll2, r2) => { c.setLatLng(ll2); if (r2) c.setRadius(r2); }}; },
    marker: (ll, html, size, z, popup, keep) => {
      const mk = L.marker(ll, {icon:L.divIcon({className:'', html, iconSize:size, iconAnchor:[size[0]/2, size[1]/2]}), zIndexOffset:z}).addTo(keep ? m : group);
      if (popup) { mk.bindPopup(popup); popups.push({ll, open: () => mk.openPopup()}); }
      return {set: ll2 => mk.setLatLng(ll2)};
    },
    openAt: ll => { const f = popups.find(x => x.ll[0] === ll[0] && x.ll[1] === ll[1]); if (f) f.open(); },
  };
}

function makeNaver() {
  const N = naver.maps, P = ll => new N.LatLng(ll[0], ll[1]);
  const m = new N.Map('map', {center:P([DATA.base.lat, DATA.base.lng]), zoom:16, zoomControl:true, zoomControlOptions:{position:N.Position.TOP_LEFT}});
  const iw = new N.InfoWindow({content:'', borderWidth:0, backgroundColor:'#fff', anchorColor:'#fff', disableAnchor:false, pixelOffset:new N.Point(0,-8)});
  let items = []; const popups = [];
  N.Event.addListener(m, 'click', () => iw.close());
  return {
    setView: (ll, z) => { m.setCenter(P(ll)); m.setZoom(z); }, panTo: ll => m.panTo(P(ll)),
    onDragStart: cb => N.Event.addListener(m, 'dragstart', cb),
    clear: () => { items.forEach(x => x.setMap(null)); items = []; popups.length = 0; iw.close(); },
    circle: (ll, radius, o, keep) => { const c = new N.Circle({map:m, center:P(ll), radius, strokeColor:o.color, strokeWeight:o.weight, strokeOpacity:0.9, fillColor:o.color, fillOpacity:o.fillOpacity, clickable:false});
      if (!keep) items.push(c); return {set: (ll2, r2) => { c.setCenter(P(ll2)); if (r2) c.setRadius(r2); }}; },
    marker: (ll, html, size, z, popup, keep) => {
      const mk = new N.Marker({map:m, position:P(ll), zIndex:z + 100, icon:{content:html, anchor:new N.Point(size[0]/2, size[1]/2)}});
      if (!keep) items.push(mk);
      if (popup) {
        const open = () => { iw.setContent(`<div style="padding:10px 12px;color:#111;font-size:14px;line-height:1.5;max-width:260px">${popup}</div>`); iw.open(m, mk); };
        N.Event.addListener(mk, 'click', open); popups.push({ll, open});
      }
      return {set: ll2 => mk.setPosition(P(ll2))};
    },
    openAt: ll => { const f = popups.find(x => x.ll[0] === ll[0] && x.ll[1] === ll[1]); if (f) f.open(); },
  };
}

function loadNaver(id) {
  return new Promise((ok, fail) => {
    window.navermap_authFailure = () => { location.replace(location.pathname + '?map=osm&why=naver-key'); };
    const sc = document.createElement('script');
    sc.src = `https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=${encodeURIComponent(id)}`;
    sc.onload = () => window.naver && naver.maps ? ok() : fail(); sc.onerror = fail;
    document.head.appendChild(sc);
    setTimeout(fail, 8000);
  });
}

function render() {
  if (!DATA) return;
  const when = chosenDate();
  $('when').textContent = `${when.getMonth()+1}월 ${when.getDate()}일 (${DAY_KO[when.getDay()]}) ${fmt(when.getHours()*60+when.getMinutes())} 기준` + (useNow ? ' · 지금' : '');
  map.clear();
  const base = DATA.base;
  map.circle([base.lat, base.lng], RADIUS, {color:'#f5b942', weight:1.5, fillOpacity:0.04});
  map.marker([base.lat, base.lng], '<div class="basepin">🎷</div>', [26,26], 1000,
    `<b>${esc(base.name)}</b><br>${esc(base.address)}${base.coordNote ? `<br><small>위치: ${esc(base.coordNote)}</small>` : ''}`);

  const rows = []; let freeStores = 0, freeLots = 0;
  for (const s of DATA.stores || []) {
    if (s.lat == null || s.lng == null) continue;
    const d = dist(base, s); if (d > RADIUS) continue;
    const st = statusAt(s.hours, when);
    if (st.state === 'closed') freeStores++;
    if (onlyFree && st.state !== 'closed') continue;
    // 주차 가능 단계: 빨강(영업 중) → 주황(1시간 안 마감) → 노랑(30분 안) → 초록(마감 후) → 진초록(휴무)
    const nowMin = when.getHours()*60 + when.getMinutes();
    const left = st.state === 'open' ? st.closeAt - nowMin : null;
    const level = st.state === 'unknown' ? -1 : st.dayOff ? 5 : st.state === 'closed' ? 4 : left <= 30 ? 3 : left <= 60 ? 2 : 1;
    const color = ({'-1':'var(--unknown)', 1:'#ef4444', 2:'#f97316', 3:'#eab308', 4:'#22c55e', 5:'#15803d'})[level];
    let stLabel = st.state === 'closed' ? (st.dayOff ? '휴무' : st.closedSince != null ? `${fmt(st.closedSince)} 닫음` : '닫힘')
                : st.state === 'open' ? (level >= 2 ? `${fmt(st.closeAt)} 마감 (${left}분 뒤)` : `${fmt(st.closeAt)}까지 영업`) : '시간 모름';
    const front = s.parkingFront ? `가게 앞 주차: ${s.parkingFront}` : '';
    const html = `<b>${esc(s.name)}</b> ${s.category ? `<small>${esc(s.category)}</small>` : ''}<br>
      <b style="color:${color}">${esc(stLabel)}</b><br>
      ${front ? esc(front) + '<br>' : ''}${s.note ? esc(s.note) + '<br>' : ''}
      <small>${esc(hoursText(s.hours))}${s.hoursNote ? '<br>' + esc(s.hoursNote) : ''}</small><br>
      <a href="${navLink(s.name, s.lat, s.lng)}" target="_blank" rel="noopener">카카오맵 길찾기</a>`;
    map.marker([s.lat, s.lng], level >= 4 ? `<div class="pin park" style="background:${color}">${st.dayOff ? '휴' : 'P'}</div>` : `<div class="pin" style="background:${color}"></div>`, level >= 4 ? [24,24] : [18,18], level * 100, html);
    rows.push({d, rank: level === -1 ? 7 : 6 - level, html:
      `<div class="item" data-lat="${s.lat}" data-lng="${s.lng}"><span class="dot" style="background:${color};margin-top:5px"></span>
       <div><b>${esc(s.name)}</b><small>${[Math.round(d)+'m', s.category, front].filter(Boolean).map(esc).join(' · ')}</small></div>
       <span class="st" style="color:${color}">${esc(stLabel)}</span></div>`});
  }
  for (const lot of DATA.lots || []) {
    const d = dist(base, lot);
    const ls = lotStatus(lot, when);
    if (ls.free) freeLots++;
    if (onlyFree && !ls.free) continue;
    const html = `<b>🅿️ ${esc(lot.name)}</b><br><b>${esc(ls.label)}</b><br>${esc(lot.free || '')}<br>
      <small>${esc(lot.fee || '')}${lot.spaces ? ` · ${lot.spaces}면` : ''}<br>${esc(lot.address || '')}${lot.coordNote ? ` (위치 ${esc(lot.coordNote)})` : ''}</small><br>
      <a href="${navLink(lot.name, lot.lat, lot.lng)}" target="_blank" rel="noopener">카카오맵 길찾기</a>${lot.source ? ` · <a href="${esc(lot.source)}" target="_blank" rel="noopener">출처</a>` : ''}`;
    map.marker([lot.lat, lot.lng], `<div class="lotpin ${ls.free ? 'free' : 'paid'}">P</div>`, ls.free ? [28,28] : [22,22], 800, html);
    rows.push({d, rank: ls.free ? -1 : 8, html:
      `<div class="item" data-lat="${lot.lat}" data-lng="${lot.lng}"><span class="dot" style="background:${ls.free ? 'var(--closed)' : '#636366'};border-radius:2px;margin-top:5px"></span>
       <div><b>${esc(lot.name)}</b><small>${Math.round(d)}m · 주차장 ${lot.spaces ? lot.spaces + '면' : ''}</small></div>
       <span class="st" style="color:${ls.free ? 'var(--closed)' : 'var(--muted)'}">${esc(ls.label)}</span></div>`});
  }
  rows.sort((a,b) => a.rank - b.rank || a.d - b.d);
  $('freeCount').textContent = `🅿️ ${useNow ? '지금' : '이 시각'} 주차 가능: 문 닫은 가게 ${freeStores}곳 · 무료 주차장 ${freeLots}곳`;
  const noStores = !(DATA.stores || []).length;
  renderChips();
  $('list').innerHTML = summaryHtml(useNow ? new Date().getDay() : selDay) + (noStores ? `<div class="note">아직 주변 가게 영업시간 자료가 없어요. 조사 결과가 들어오면 가게가 지도에 나타나요. 지금은 주차장만 보여요.</div>` : '')
    + rows.map(r => r.html).join('')
    + `<div class="note">초록 = 그 시각에 문 닫은 가게예요. 가게 앞에 세울 수 있는지는 현장 표지판·단속 안내를 꼭 확인하세요. 영업시간은 지도 정보 기준이라 실제와 다를 수 있어요. 공휴일은 따로 계산하지 않아요.<br>자료 기준일: ${esc(DATA.updatedAt || '')}</div>`;
  document.querySelectorAll('.tl').forEach(el => el.onclick = () => { selMin = Number(el.dataset.min); if (useNow) selDay = new Date().getDay(); useNow = false; render(); });
  document.querySelectorAll('.item').forEach(el => el.onclick = () => {
    const ll = [Number(el.dataset.lat), Number(el.dataset.lng)];
    map.setView(ll, 18); map.openAt(ll);
  });
}

function setNow(on) {
  useNow = on;
  if (on) selDay = new Date().getDay();
  render();
}

function locate() {
  if (!navigator.geolocation) { alert('이 브라우저는 위치를 지원하지 않아요.'); return; }
  follow = true;
  $('btnMe').classList.add('on');
  if (watchId !== null) { if (mePos) map.setView(mePos, 17); return; }
  watchId = navigator.geolocation.watchPosition(p => {
    const ll = [p.coords.latitude, p.coords.longitude];
    mePos = ll;
    if (!meMarker) {
      meMarker = map.marker(ll, '<div class="me"></div>', [16,16], 2000, '내 위치', true);
      meAccuracy = map.circle(ll, p.coords.accuracy, {color:'#0a84ff', weight:1, fillOpacity:0.08}, true);
      map.setView(ll, 17);
    } else {
      meMarker.set(ll); meAccuracy.set(ll, p.coords.accuracy);
      if (follow) map.panTo(ll);
    }
  }, e => {
    alert(e.code === 1 ? '위치 권한이 꺼져 있어요. 휴대폰 설정에서 이 사이트의 위치 사용을 허용해 주세요.' : '위치를 찾지 못했어요. 잠시 뒤 다시 눌러 주세요.');
    $('btnMe').classList.remove('on'); navigator.geolocation.clearWatch(watchId); watchId = null;
  }, {enableHighAccuracy:true, maximumAge:5000, timeout:20000});
}

async function init() {
  try {
    DATA = await (await fetch('stores.json', {cache:'no-cache'})).json();
  } catch (e) {
    $('list').innerHTML = '<div class="note">자료(stores.json)를 불러오지 못했어요. 새로고침해 주세요.</div>'; return;
  }
  // 가게 위치는 stores.json의 base(탄방로7번길 139)로 고정. 예전에 기기에 저장한 위치는 지움
  try { localStorage.removeItem(BASE_KEY); } catch (e) {}
  const q = new URLSearchParams(location.search);
  if (DATA.naverClientId && q.get('map') !== 'osm') {
    try { await loadNaver(DATA.naverClientId); map = makeNaver(); } catch (e) { map = null; }
  }
  if (!map) map = makeLeaflet();
  if (q.get('why') === 'naver-key') $('when').insertAdjacentHTML('afterend', '<span class="when" style="color:var(--open)">네이버 지도 열쇠가 안 맞아서 기본 지도로 보여요.</span>');
  map.onDragStart(() => { follow = false; $('btnMe').classList.remove('on'); });
  map.setView([DATA.base.lat, DATA.base.lng], 17);
  $('btnFree').onclick = () => { onlyFree = !onlyFree; $('btnFree').classList.toggle('on', onlyFree); render(); };
  $('btnMe').onclick = locate;
  setNow(true);
  setTimeout(() => map.setView([DATA.base.lat, DATA.base.lng], 17), 50);
  setInterval(() => { if (useNow) setNow(true); }, 60000);
}
init();
</script>
</body>
</html>
